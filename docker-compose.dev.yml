services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-SmartLog Analyzer}"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:${APP_PORT:-8000}}"
      SMARTLOG_API_KEY: ${SMARTLOG_API_KEY:-local-only-smartlog-key}
      LLM_DRIVER: ${LLM_DRIVER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      # Host y puerto internos de PostgreSQL en la red de Compose
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-mydatabase}
      DB_USERNAME: ${DB_USERNAME:-myuser}
      DB_PASSWORD: ${DB_PASSWORD:-mypassword}
      CACHE_STORE: ${CACHE_STORE:-redis}
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      # Host y puerto internos de Redis en la red de Compose
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "sh", "/var/www/html/docker/entrypoint.dev.sh" ]

  db:
    image: postgres:14.24
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mydatabase}
      POSTGRES_USER: ${DB_USERNAME:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.12-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  vendor:
