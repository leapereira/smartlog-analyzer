name: smartlog-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./vendor:/var/www/html/vendor
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-SmartLog Analyzer}"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:${APP_PORT:-8000}}"
      SMARTLOG_API_KEY: ${SMARTLOG_API_KEY:-smartlog-api-key}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
      LOG_ANALYSIS_RATE_LIMIT_PER_MINUTE: ${LOG_ANALYSIS_RATE_LIMIT_PER_MINUTE:-10}
      LLM_DRIVER: ${LLM_DRIVER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-30}
      OPENAI_CONNECT_TIMEOUT: ${OPENAI_CONNECT_TIMEOUT:-5}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1500}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      # Host y puerto internos de PostgreSQL en la red de Compose
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-smartlog_dev_db}
      DB_USERNAME: ${DB_USERNAME:-smartlog_dev_user}
      DB_PASSWORD: ${DB_PASSWORD:-smartlog_dev_password}
      CACHE_STORE: ${CACHE_STORE:-redis}
      ANALYSIS_CACHE_TTL: ${ANALYSIS_CACHE_TTL:-3600}
      ANALYSIS_LOCK_SECONDS: ${ANALYSIS_LOCK_SECONDS:-60}
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      # Host y puerto internos de Redis en la red de Compose
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1/up" ]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: [ "sh", "/var/www/html/docker/entrypoint.dev.sh" ]
    command: [ "apache2-foreground" ]

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-smartlog_dev_db}
      POSTGRES_USER: ${DB_USERNAME:-smartlog_dev_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartlog_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.12-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
